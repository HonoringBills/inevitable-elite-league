name: Validate Cloudflare Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: JavaScript syntax check
        run: |
          node --check app.js
          for file in js/*.js src/*.js; do node --check "$file"; done
      - name: Build static assets
        run: npm run build
      - name: Verify output
        run: |
          test -f dist/index.html
          test -f dist/styles.css
          test -f dist/original-iel-theme.css
          test -f dist/match-reporting.css
          test -f dist/app.js
          test -f dist/js/core.js
          test -f dist/js/public.js
          test -f dist/js/registration.js
          test -f dist/js/staff.js
          test -f dist/js/stats.js
          test -f dist/js/staff-enhancements.js
          test -f dist/js/series-roster-memory.js
          test -f dist/js/apply-all-review.js
          test -f dist/js/verify-without-stats.js
          test -f src/worker.js
          test -f src/worker-entry.js
      - name: Validate Worker bundle
        run: npx wrangler@4.120.0 deploy --dry-run
