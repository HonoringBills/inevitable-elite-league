name: Validate Cloudflare Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Build static assets
        run: npm run build
      - name: Verify output
        run: |
          test -f dist/index.html
          test -f dist/styles.css
          test -f dist/app.js
          test -f dist/js/core.js
          test -f dist/js/public.js
          test -f dist/js/registration.js
          test -f dist/js/staff.js
